<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EmulatorJS Player</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
      }
      body {
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      .error {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        color: #f5f5f5;
        background: radial-gradient(circle at top, #242424, #050505 70%);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module">
      import {
        EmulatorJsBrowserSaveStore,
        EmulatorJsSaveTree,
      } from './mga-save-store.js'

      const params = new URLSearchParams(window.location.search)
      const sessionId = params.get('session')
      const mount = document.getElementById('game')
      const runtimeOrigin = window.location.origin
      let latestSaveBase64 = null
      let latestSavePath = null
      let nativeRequestCounter = 0
      const pendingNativeRequests = new Map()
      let saveRamSyncTimer = null
      let saveRamSyncInFlight = false
      let pendingSaveRamPayload = null
      let browserSaveStore = null
      let hydratedSaveRamRecord = null
      let nativeSaveSyncEnabled = false
      function scheduleResizePass() {
        window.dispatchEvent(new Event('resize'))
        window.requestAnimationFrame(() => window.dispatchEvent(new Event('resize')))
        window.setTimeout(() => window.dispatchEvent(new Event('resize')), 150)
      }

      function renderError(message) {
        mount.className = 'error'
        mount.textContent = message
      }

      function bytesToBase64(bytes) {
        let binary = ''
        for (let index = 0; index < bytes.length; index += 1) {
          binary += String.fromCharCode(bytes[index])
        }
        return btoa(binary)
      }

      function base64ToBytes(base64) {
        const binary = atob(base64)
        const bytes = new Uint8Array(binary.length)
        for (let index = 0; index < binary.length; index += 1) {
          bytes[index] = binary.charCodeAt(index)
        }
        return bytes
      }

      function postBridgeMessage(message) {
        window.parent.postMessage(message, runtimeOrigin)
      }

      function nextNativeRequestId() {
        nativeRequestCounter += 1
        return `native-${Date.now()}-${nativeRequestCounter}`
      }

      function requestParent(message, responseTypes) {
        const requestId = nextNativeRequestId()
        return new Promise((resolve, reject) => {
          const timeoutId = window.setTimeout(() => {
            pendingNativeRequests.delete(requestId)
            reject(new Error('The MGA save backup request timed out. Your local browser save is unchanged.'))
          }, 20000)
          pendingNativeRequests.set(requestId, {
            responseTypes,
            resolve: (reply) => {
              window.clearTimeout(timeoutId)
              resolve(reply)
            },
          })
          postBridgeMessage({ ...message, requestId })
        })
      }

      function displayMessage(message) {
        try {
          window.EJS_emulator?.displayMessage?.(message)
        } catch {
          // Runtime messages are best-effort only.
        }
      }

      function saveFilePath() {
        return window.EJS_emulator?.gameManager?.getSaveFilePath?.()
      }

      function flushCoreSaveFiles() {
        try {
          window.EJS_emulator?.gameManager?.functions?.saveSaveFiles?.()
        } catch {
          // Some cores do not expose save RAM. A failed flush should not break state sync.
        }
      }

      function currentStateSlot() {
        return String(
          window.EJS_emulator?.getSettingValue?.('save-state-slot') ||
            window.EJS_emulator?.settings?.['save-state-slot'] ||
            '1',
        )
      }

      function collectSaveFiles(payloadSave = null) {
        const FS = window.EJS_emulator?.gameManager?.FS
        if (!FS) return []
        return EmulatorJsSaveTree.collect(
          FS,
          saveFilePath() || latestSavePath || 'save.ram',
          payloadSave,
        )
      }

      function writeSaveFiles(files) {
        if (!Array.isArray(files) || files.length === 0) {
          throw new Error('No EmulatorJS save file was provided.')
        }
        const saveFiles = EmulatorJsSaveTree.replace(window.EJS_emulator.gameManager.FS, files)
        latestSavePath = saveFiles[0].path
        latestSaveBase64 = saveFiles[0].base64
        window.EJS_emulator.gameManager.loadSaveFiles()
      }

      function exportSnapshot(requestId) {
        try {
          flushCoreSaveFiles()
          const files = collectSaveFiles()
          if (files.length === 0 && latestSavePath && latestSaveBase64) {
            postBridgeMessage({
              type: 'export-result',
              requestId,
              snapshot: {
                files: [{ path: latestSavePath, base64: latestSaveBase64 }],
              },
            })
            return
          }
          if (files.length === 0) {
            postBridgeMessage({ type: 'export-result', requestId, snapshot: { files: [] } })
            return
          }
          latestSavePath = files[0].path
          latestSaveBase64 = files[0].base64
          postBridgeMessage({
            type: 'export-result',
            requestId,
            snapshot: {
              files,
            },
          })
        } catch (error) {
          postBridgeMessage({
            type: 'export-result',
            requestId,
            error: error instanceof Error ? error.message : 'Unable to export EmulatorJS saves.',
          })
        }
      }

      async function importSnapshot(requestId, files) {
        try {
          const record = await browserSaveStore.put('save-ram', files)
          hydratedSaveRamRecord = record
          writeSaveFiles(record.files)
          postBridgeMessage({ type: 'import-result', requestId, ok: true })
        } catch (error) {
          postBridgeMessage({
            type: 'import-result',
            requestId,
            ok: false,
            error: error instanceof Error ? error.message : 'Unable to import EmulatorJS saves.',
          })
        }
      }

      async function saveNativeState(slot, state, quiet = false) {
        if (!state) {
          if (!quiet) displayMessage('No save-state data is available yet.')
          return
        }
        const effectiveSlot = String(slot || '1')
        const slotId = `state-${effectiveSlot}`
        const files = [{ path: `${slotId}.state`, base64: bytesToBase64(state) }]
        const localRecord = await browserSaveStore.put(slotId, files)
        postBridgeMessage({
          type: 'local-save-status',
          status: 'saved',
          message: `Save state slot ${effectiveSlot} is stored in this browser.`,
        })
        if (nativeSaveSyncEnabled) {
          try {
            const reply = await requestParent(
              {
                type: 'native-save-state',
                slot: effectiveSlot,
                stateBase64: files[0].base64,
                baseManifestHash: localRecord.lastSyncedManifestHash || undefined,
              },
              ['native-save-result'],
            )
            if (!reply.ok) {
              throw new Error(reply.error || 'Unable to back up the save state.')
            }
            if (reply.manifestHash) {
              await browserSaveStore.markSynced(slotId, localRecord.revision, reply.manifestHash)
            }
          } catch (error) {
            postBridgeMessage({
              type: 'local-save-status',
              status: 'backup_error',
              message: error instanceof Error
                ? `Saved in this browser, but backup needs attention: ${error.message}`
                : 'Saved in this browser, but backup needs attention.',
            })
            if (!quiet) displayMessage('Saved in this browser, but the backup needs attention.')
            return
          }
        }
        if (!quiet) {
          displayMessage(
            nativeSaveSyncEnabled
              ? `Saved and backed up state slot ${effectiveSlot}.`
              : `Saved state slot ${effectiveSlot} in this browser.`,
          )
        }
      }

      async function loadNativeState(slot) {
        const effectiveSlot = String(slot || '1')
        const slotId = `state-${effectiveSlot}`
        let localRecord = await browserSaveStore.get(slotId)
        if (!localRecord && nativeSaveSyncEnabled) {
          const reply = await requestParent(
            { type: 'native-load-state', slot: effectiveSlot },
            ['native-load-state-result'],
          )
          if (!reply.ok) {
            throw new Error(reply.error || 'Unable to load the backed-up save state.')
          }
          if (reply.stateBase64) {
            localRecord = await browserSaveStore.put(
              slotId,
              [{ path: `${slotId}.state`, base64: reply.stateBase64 }],
              { syncedManifestHash: reply.manifestHash || '' },
            )
          }
        }
        const stateBase64 = localRecord?.files?.[0]?.base64
        if (!stateBase64) {
          throw new Error(`No save state exists in slot ${effectiveSlot} for this player and game copy.`)
        }
        window.EJS_emulator.gameManager.loadState(base64ToBytes(stateBase64))
        displayMessage(`Loaded save state slot ${effectiveSlot}.`)
      }

      async function saveNativeRam(save, quiet = false, options = {}) {
        if (options.flushCore) {
          flushCoreSaveFiles()
        }
        const files = collectSaveFiles(save)
        if (files.length === 0) {
          if (!quiet) displayMessage('This game has not created save data yet.')
          return
        }
        const localRecord = await browserSaveStore.put('save-ram', files)
        latestSavePath = files[0].path
        latestSaveBase64 = files[0].base64
        postBridgeMessage({
          type: 'local-save-status',
          status: 'saved',
          message: `${files.length} save ${files.length === 1 ? 'file is' : 'files are'} stored in this browser.`,
          fileCount: files.length,
        })
        if (nativeSaveSyncEnabled) {
          try {
            const reply = await requestParent(
              {
                type: 'native-save-ram',
                files,
                baseManifestHash: localRecord.lastSyncedManifestHash || undefined,
              },
              ['native-save-result'],
            )
            if (!reply.ok) {
              throw new Error(reply.error || 'Unable to back up the browser save.')
            }
            if (reply.manifestHash) {
              await browserSaveStore.markSynced('save-ram', localRecord.revision, reply.manifestHash)
            }
          } catch (error) {
            postBridgeMessage({
              type: 'local-save-status',
              status: 'backup_error',
              message: error instanceof Error
                ? `Saved in this browser, but backup needs attention: ${error.message}`
                : 'Saved in this browser, but backup needs attention.',
              fileCount: files.length,
            })
            if (!quiet) displayMessage('Saved in this browser, but the backup needs attention.')
            return
          }
        }
        if (!quiet) {
          displayMessage(nativeSaveSyncEnabled ? 'Saved here and backed up.' : 'Saved in this browser.')
        }
      }

      async function loadNativeRam(quiet = false) {
        let localRecord = await browserSaveStore.get('save-ram')
        if (!localRecord && nativeSaveSyncEnabled) {
          const reply = await requestParent({ type: 'native-load-ram' }, ['native-load-ram-result'])
          if (!reply.ok) {
            throw new Error(reply.error || 'Unable to load the browser save backup.')
          }
          if (Array.isArray(reply.files) && reply.files.length > 0) {
            localRecord = await browserSaveStore.put('save-ram', reply.files, {
              syncedManifestHash: reply.manifestHash || '',
            })
          }
        }
        if (!localRecord?.files?.length) {
          if (quiet) return false
          throw new Error('No save exists for this player and game copy yet.')
        }
        writeSaveFiles(localRecord.files)
        if (!quiet) displayMessage('Loaded the save stored for this player and game copy.')
        return true
      }

      function queueSaveRamSync(payload = {}) {
        pendingSaveRamPayload = payload || {}
        if (saveRamSyncTimer) {
          window.clearTimeout(saveRamSyncTimer)
        }
        saveRamSyncTimer = window.setTimeout(() => {
          void flushSaveRamSync()
        }, 500)
      }

      async function flushSaveRamSync() {
        if (saveRamSyncInFlight || !pendingSaveRamPayload) return
        const payload = pendingSaveRamPayload
        pendingSaveRamPayload = null
        saveRamSyncInFlight = true
        try {
          await saveNativeRam(payload?.save, true, { flushCore: !payload?.save })
        } catch (error) {
          displayMessage(error instanceof Error ? error.message : 'Unable to sync save RAM.')
        } finally {
          saveRamSyncInFlight = false
          if (pendingSaveRamPayload) {
            void flushSaveRamSync()
          }
        }
      }

      window.addEventListener('pagehide', () => {
        if (!window.EJS_emulator?.gameManager) return
        pendingSaveRamPayload = {}
        void flushSaveRamSync()
      })

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState !== 'hidden' || !window.EJS_emulator?.gameManager) return
        pendingSaveRamPayload = {}
        void flushSaveRamSync()
      })

      window.addEventListener('message', (event) => {
        if (event.origin !== runtimeOrigin) return
        const message = event.data
        if (!message || typeof message !== 'object' || !('type' in message)) return
        if (message.requestId && pendingNativeRequests.has(message.requestId)) {
          const pending = pendingNativeRequests.get(message.requestId)
          if (pending.responseTypes.includes(message.type)) {
            pendingNativeRequests.delete(message.requestId)
            pending.resolve(message)
            return
          }
        }
        if (message.type === 'export-save-snapshot') {
          exportSnapshot(message.requestId)
        } else if (message.type === 'import-save-snapshot') {
          void importSnapshot(message.requestId, message.files)
        } else if (message.type === 'mark-local-save-synced') {
          void browserSaveStore
            ?.get(message.slotId)
            .then((record) =>
              record
                ? browserSaveStore.markSynced(message.slotId, record.revision, message.manifestHash)
                : false,
            )
        }
      })

      if (!sessionId) {
        renderError('Missing browser-play session token.')
      } else {
        const raw = sessionStorage.getItem(`mga.browserPlaySession.${sessionId}`)
        if (!raw) {
          renderError('Browser-play session was not found.')
        } else {
          const session = JSON.parse(raw)
          const selectedProfileId = localStorage.getItem('mga.selectedProfileId') || ''
          if (!session.ownerProfileId || session.ownerProfileId !== selectedProfileId) {
            renderError('This browser-play session belongs to another MGA profile.')
          } else if (session.runtime !== 'emulatorjs') {
            renderError('Invalid EmulatorJS session payload.')
          } else {
            nativeSaveSyncEnabled = session.nativeSaveSync === true
            try {
              browserSaveStore = await EmulatorJsBrowserSaveStore.open({
                ownerProfileId: session.ownerProfileId,
                sourceGameId: session.sourceGameId,
                core: session.core,
              })
              hydratedSaveRamRecord = await browserSaveStore.get('save-ram')
            } catch (error) {
              renderError(
                error instanceof Error
                  ? `MGA cannot safely store this game's progress: ${error.message}`
                  : "MGA cannot safely store this game's progress in this browser.",
              )
            }

            if (browserSaveStore) {
              const runtimeVersion = 'mga-20260730-profile-save-store'
              const runtimeDataUrl = new URL('./data/', window.location.href)
              const loaderUrl = new URL('./data/loader.js', window.location.href)
              const emulatorScriptUrl = new URL('./data/emulator.min.js', window.location.href)
              const emulatorStyleUrl = new URL('./data/emulator.min.css', window.location.href)
              loaderUrl.searchParams.set('v', runtimeVersion)
              emulatorScriptUrl.searchParams.set('v', runtimeVersion)
              emulatorStyleUrl.searchParams.set('v', runtimeVersion)
              window.EJS_ready = () => {
                scheduleResizePass()
                postBridgeMessage({
                  type: 'ready',
                  saveAdapter: true,
                  nativeSaveSync: nativeSaveSyncEnabled,
                })
              }
              window.EJS_onSaveDatabaseLoaded = (fileSystem) => {
                try {
                  const files = hydratedSaveRamRecord?.files ?? []
                  EmulatorJsSaveTree.replace(fileSystem, files)
                  postBridgeMessage({
                    type: 'local-save-status',
                    status: 'ready',
                    message:
                      files.length > 0
                        ? `Loaded ${files.length} save ${files.length === 1 ? 'file' : 'files'} for this player and game copy.`
                        : 'Save storage is ready for this player and game copy.',
                    fileCount: files.length,
                  })
                } catch (error) {
                  postBridgeMessage({
                    type: 'runtime-error',
                    error:
                      error instanceof Error
                        ? `MGA could not prepare this game's local save: ${error.message}`
                        : "MGA could not prepare this game's local save.",
                  })
                  throw error
                }
              }
              window.EJS_onGameStart = () => {
                scheduleResizePass()
                if (!hydratedSaveRamRecord && nativeSaveSyncEnabled) {
                  void loadNativeRam(true)
                    .catch((error) => {
                      postBridgeMessage({
                        type: 'local-save-status',
                        status: 'backup_error',
                        message:
                          error instanceof Error
                            ? `The game started with an empty local save because the backup could not be loaded: ${error.message}`
                            : 'The game started with an empty local save because the backup could not be loaded.',
                      })
                    })
                    .finally(() => {
                      window.setTimeout(() => queueSaveRamSync({}), 5000)
                    })
                } else {
                  window.setTimeout(() => queueSaveRamSync({}), 5000)
                }
              }
              window.EJS_onSaveSaveFiles = () => {
                queueSaveRamSync({})
              }
              window.EJS_onSaveState = (payload) => {
                void saveNativeState(currentStateSlot(), payload?.state).catch((error) => {
                  displayMessage(error instanceof Error ? error.message : 'Unable to store the save state.')
                })
              }
              window.EJS_onLoadState = () => {
                void loadNativeState(currentStateSlot()).catch((error) => {
                  displayMessage(error instanceof Error ? error.message : 'Unable to load the save state.')
                })
              }
              window.EJS_onQuickSaveState = (payload) => {
                void saveNativeState(payload?.slot || currentStateSlot(), payload?.state, true).catch((error) => {
                  displayMessage(error instanceof Error ? error.message : 'Unable to store the quick-save state.')
                })
              }
              window.EJS_onQuickLoadState = (payload) => {
                void loadNativeState(payload?.slot || currentStateSlot()).catch((error) => {
                  displayMessage(error instanceof Error ? error.message : 'Unable to load the quick-save state.')
                })
              }
              window.EJS_onSaveSave = (payload) => {
                void saveNativeRam(payload?.save, false).catch((error) => {
                  displayMessage(error instanceof Error ? error.message : 'Unable to store the game save.')
                })
              }
              window.EJS_onLoadSave = () => {
                void loadNativeRam().catch((error) => {
                  displayMessage(error instanceof Error ? error.message : 'Unable to load the game save.')
                })
              }
              window.EJS_player = '#game'
              window.EJS_core = session.core
              window.EJS_gameUrl = session.gameUrl
              window.EJS_gameName = session.gameName
              window.EJS_pathtodata = runtimeDataUrl.href
              window.EJS_paths = {
                'emulator.min.js': emulatorScriptUrl.href,
                'emulator.min.css': emulatorStyleUrl.href,
              }
              window.EJS_startOnLoaded = true
              window.EJS_fixedSaveInterval = 10000
              // Fullscreen-on-load usually gets blocked by the browser and leaves
              // the runtime controls in the wrong state. Enter fullscreen manually.
              window.EJS_fullscreenOnLoaded = false
              window.EJS_disableAutoLang = false
              window.EJS_DEBUG_XX = false
              await import(loaderUrl.href)
            }
          }
        }
      }
    </script>
  </body>
</html>
