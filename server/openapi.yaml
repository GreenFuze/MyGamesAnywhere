  /api/media/{assetID}:
    get:
      summary: Stream cached media file
      description: 'Serves a file from MEDIA_ROOT using media_assets.id and the row''s local_path (must be relative, no ''..''). Set MEDIA_ROOT in config (default ./media). Use media[].asset_id from game detail. Supports Range, HEAD and conditional requests via http.ServeContent: the ETag is the stored SHA-256 of the downloaded bytes, or a weak size-and-mtime validator for rows with no recorded checksum. Cached as private, not public, because the asset is only served to an authorized profile.'
      parameters:
        - name: assetID
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Binary stream
        400:
          description: Invalid id
        404:
          description: Unknown asset or missing file with no safe original URL
        500:
          description: Internal server error
    head:
      summary: Read media size and validator without the bytes
      description: Same authorization and headers as GET, with no body. A client that caches artwork asks for the length and ETag before spending the bandwidth.
      parameters:
        - name: assetID
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'Headers only: Content-Type, Content-Length, ETag, Accept-Ranges'
        400:
          description: Invalid id
        404:
          description: Unknown asset or missing file with no safe original URL
        500:
          description: Error response

