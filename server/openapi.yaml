  /api/devices/validation-schedule:
    get:
      summary: Get automatic installed-game check status
      description: Returns the active profile's schedule and per-device visibility for the shared manual/background MGA installation validator.
      deprecated: true
      responses:
        200:
          description: InstallationValidationScheduleStatus JSON
        400:
          description: Error response
        401:
          description: Profile sign-in required
        410:
          description: Feature retired; no mutation or local client operation was performed
        500:
          description: Internal server error
    put:
      summary: Configure automatic installed-game checks
      description: Enables or pauses profile-scoped automatic validation and selects an interval from 5 minutes through 24 hours.
      deprecated: true
      requestBody:
        description: 'JSON: { enabled: boolean, interval_minutes: number }'
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: InstallationValidationScheduleStatus JSON
        400:
          description: Invalid interval
        401:
          description: Profile sign-in required
        410:
          description: Feature retired; no mutation or local client operation was performed
        500:
          description: Internal server error

