  /api/devices/client-launches:
    post:
      summary: Start the selected MGA Client mode
      description: Creates a short-lived signed browser-to-client launch challenge. Standard is the default; elevated requests require the local Windows user to approve UAC before the client redeems the challenge.
      deprecated: true
      requestBody:
        description: 'JSON: { execution_mode?: ''standard'' | ''elevated'' }'
        content:
          application/json:
            schema:
              type: object
      responses:
        201:
          description: Client launch challenge JSON
        400:
          description: Invalid execution mode
        401:
          description: Profile sign-in required
        403:
          description: Manage access required
        410:
          description: Feature retired; no mutation or local client operation was performed
        500:
          description: Internal server error

