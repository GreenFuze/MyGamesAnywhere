          description: Missing id or candidate not eligible
        404:
          description: Candidate not found
        500:
          description: Metadata providers unavailable or internal server error

  /api/review-candidates/{id}/search:
    post:
      summary: Search metadata providers for a review candidate
      description: Runs a manual search across configured metadata providers for one candidate. If query is omitted, the server derives a best-effort title query from the candidate data.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: 'Optional JSON: { query?: string }'
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: ManualReviewSearchResponse JSON
        400:
          description: Invalid body or missing id
        404:
          description: Candidate not found
        500:
          description: Internal server error

  /api/review-candidates/{id}/unarchive:
    post:
      summary: Restore an archived manual-review candidate
      description: Moves an archived candidate back into the active queue and resets its review_state to pending so it can be worked again.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Updated ManualReviewCandidateDetail JSON
        400:
          description: Missing id
        404:
          description: Candidate not found
        500:
          description: Internal server error

  /api/runtime-artifacts:
    get:
      summary: List runtime and emulator artifacts
      description: Returns the authenticated profile a server-global registry of runtime/emulator package metadata, license, acquisition, compliance, integrity, compatibility and storage evidence. Server filesystem paths are never returned.
      responses:
        200:
          description: JSON object with artifacts[]
        400:
          description: Error response
        401:
          description: Authentication required
        403:
          description: Profile access forbidden
        500:
          description: Internal server error
    post:
      summary: Create a runtime or emulator artifact
      description: Administrator-only complete artifact registration. Unknown license, prohibited category, non-HTTPS source, invalid integrity evidence or inconsistent delivery policy fails closed.
      requestBody:
        description: Complete runtime artifact JSON object
        content:
          application/json:
            schema:
              type: object
      responses:
        201:
          description: Created artifact
        400:
          description: Invalid artifact policy or evidence
        403:
          description: Administrator required
        500:
          description: Internal server error

  /api/runtime-artifacts/{artifact_id}:
    get:
      summary: Get a runtime or emulator artifact
      description: Returns one artifact's compliance and provenance metadata under authenticated selected-profile context.
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Runtime artifact metadata
        400:
          description: Error response
        404:
          description: Artifact not found
        500:
          description: Internal server error
    put:
      summary: Update a runtime or emulator artifact
      description: Administrator-only full replacement. Artifact identity must match the path; blocking compliance preserves the row and prevents bytes.
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: Complete runtime artifact JSON object
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: Updated artifact
        400:
          description: Invalid artifact policy, evidence or identity
        403:
          description: Administrator required
        500:
          description: Internal server error

  /api/runtime-artifacts/{artifact_id}/content:
    get:
      summary: Download an approved runtime artifact
      description: Authenticates the selected profile, revalidates compliance and redistributability, derives a content-addressed path, verifies length and SHA-256, then serves one optional byte range with safe headers.
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Complete verified artifact bytes
        400:
          description: Error response
        404:
          description: Artifact not found
        409:
          description: Delivery blocked or integrity failed
        500:
          description: Internal server error
    head:
      summary: Inspect an approved runtime artifact
      description: Performs the same authorization, compliance and integrity checks as GET and returns delivery headers without bytes.
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Verified artifact headers
        400:
          description: Error response
        404:
          description: Artifact not found
        409:
          description: Delivery blocked or integrity failed
        500:
          description: Error response

  /api/save-sync/domains/{domain_id}/history:
    get:
      summary: List retained saves for one Save Domain
      description: Returns the active profile's bounded, server-accepted history for one exact Save Domain. Evidence contains safe origin and route labels; it never exposes local paths, file names, endpoint identifiers, credentials, or another profile's data.
      parameters:
        - name: domain_id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: SaveDomainHistory JSON
        400:
          description: Invalid domain or profile context
        500:
          description: Internal server error

  /api/save-sync/domains/{domain_id}/history-policy:
    put:
      summary: Set retention for one Save Domain
      description: Sets active-profile retention and immediately prunes older metadata and server-local payloads. Supported bounds are 1–50 versions and 1–365 days.
      parameters:
        - name: domain_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: 'JSON: { retain_versions: number, retain_days: number }'
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: Updated SaveDomainHistory JSON
        400:
          description: Invalid domain, profile context, or retention bounds
        500:
          description: Internal server error

  /api/save-sync/history/{version_id}/recover:
    post:
      summary: Restore a retained Save Domain version
      description: Restores one version owned by the active profile. MGA retains the current save before promotion and then queues the normal provider upload; a failed activation preserves the current snapshot.
      parameters:
        - name: version_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: Empty JSON object
        content:
          application/json:
            schema:
              type: object
      responses:
        202:
          description: SaveSyncPutResult JSON
        400:
          description: Invalid version or profile context
        409:
          description: Version unavailable, invalid, or recovery failed
        500:
          description: Internal server error

  /api/save-sync/migrations:
    post:
      summary: Start a save-sync migration job
      description: Starts a background save migration from one save-sync integration to another. Supports `scope=all` or `scope=game`; `game` requires `canonical_game_id`. Progress and completion arrive over SSE and can also be polled by job id.
      requestBody:
        description: 'JSON: { source_integration_id, target_integration_id, scope: "all"|"game", canonical_game_id?, delete_source_after_success? }'
        content:
          application/json:
            schema:
              type: object
      responses:
        202:
          description: SaveSyncMigrationStatus JSON
        400:
          description: Invalid request body or unsupported scope
        500:
          description: Internal server error

  /api/save-sync/migrations/{job_id}:
    get:
      summary: Get save-sync migration job status
      description: Returns the latest in-memory status for a save-sync migration job, including counts for total, completed, migrated, skipped, and any terminal error.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: SaveSyncMigrationStatus JSON
        400:
          description: Error response
        404:
          description: Unknown job id
        500:
          description: Internal server error

  /api/save-sync/prefetch/{job_id}:
    get:
      summary: Get save-sync prefetch job status
      description: Returns the latest in-memory status for a save-sync prefetch job, including progress, cached/missing/failed slot counts, and any terminal error.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: SaveSyncPrefetchStatus JSON
        400:
          description: Error response
        404:
          description: Unknown job id
        500:
          description: Internal server error

  /api/scan:
    get:
      summary: Run full scan
      description: 'Same as POST /api/scan with no body: starts an asynchronous full-library scan job across all game source integrations.'
      responses:
        202:
          description: ScanJobStatus JSON
        400:
          description: Error response
        409:
          description: Another scan job is already active; returns the active ScanJobStatus
        500:
          description: Internal server error
    post:
      summary: Run scan
      description: 'Starts an asynchronous scan job. Runs discovery: calls each source plugin (source.library.list) and, for integrations with root_path in config, runs the local inventory pipeline. Optional body limits which sources to scan or requests metadata-only refresh.'
      requestBody:
        description: 'Optional JSON: { "game_sources": ["integration-id-1", ...], "metadata_only": true|false }. Omitted or empty game_sources = scan all sources.'
        content:
          application/json:
            schema:
              type: object
      responses:
        202:
          description: ScanJobStatus JSON
        400:
          description: Invalid JSON body
        409:
          description: Another scan job is already active; returns the active ScanJobStatus
        500:
          description: Internal server error

  /api/scan/background:
    get:
      summary: Get automatic library scan status
      description: Returns the active profile's automatic scan schedule, next run, latest outcome, and active background job when one is running.
      responses:
        200:
          description: LibraryScanScheduleStatus JSON
        400:
          description: Error response
        500:
          description: Internal server error
    put:
      summary: Configure automatic library scans
      description: Enables or disables profile-scoped automatic source scans and sets their interval in minutes. Automatic and manual scans use the same scan job coordinator and reconciliation pipeline.
      responses:
        200:
          description: Updated LibraryScanScheduleStatus JSON
        400:
          description: Invalid JSON or interval
        500:
          description: Error response

  /api/scan/jobs/{job_id}:
    get:
      summary: Get scan job status
      description: Returns the current in-memory status for an asynchronous scan job, including state, integration-level progress snapshots, a rolling recent-events log, current integration, report id, and any terminal error.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: ScanJobStatus JSON
        400:
          description: job_id is required
        404:
          description: Unknown job id
        500:
          description: Internal server error

  /api/scan/jobs/{job_id}/cancel:
    post:
      summary: Cancel a running scan job
      description: Requests cancellation for an asynchronous scan job. Returns the updated ScanJobStatus. Jobs transition through cancelling and then cancelled if the worker exits due to context cancellation.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: ScanJobStatus JSON; job was already cancelling or cancelled
        202:
          description: ScanJobStatus JSON; cancellation requested
        400:
          description: job_id is required
        404:
          description: Unknown job id
        409:
          description: ScanJobStatus JSON; job is already completed or failed
        500:
          description: Internal server error

  /api/scan/reports:
    get:
      summary: List recent scan reports
      description: 'Returns the most recent persisted scan reports in reverse chronological order. Query: limit (optional, defaults to 10). Each report includes totals plus per-integration diff summaries.'
      responses:
        200:
          description: Array of ScanReport JSON objects
        400:
          description: Error response
        500:
          description: Internal server error

  /api/scan/reports/{id}:
    get:
      summary: Get one scan report
      description: Returns one persisted scan report by id, including totals, timing, metadata_only flag, and per-integration results.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: ScanReport JSON
        400:
          description: id is required
        404:
          description: Report not found
        500:
          description: Internal server error

