          description: Error response

  /api/frontend/v1/games/{id}:
    get:
      summary: Read one canonical game
      description: Requires scope catalog.read. The id is the stable canonical game id an external frontend maps its own records onto.
      parameters:
        - name: id
          in: path
          required: true
          schema:
