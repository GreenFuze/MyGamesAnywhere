openapi: 3.0.3
info:
  title: MyGamesAnywhere Server API
  description: Public HTTP API for the MyGamesAnywhere server and web interface.
  version: 1.0.0
paths:

  /*:
    connect:
      responses:
        400:
          description: Error response
        500:
          description: Error response
    delete:
      responses:
        400:
          description: Error response
        500:
          description: Error response
    get:
      responses:
        400:
          description: Error response
        500:
          description: Error response
    head:
      responses:
        400:
          description: Error response
        500:
          description: Error response
    options:
      responses:
        400:
          description: Error response
        500:
          description: Error response
    patch:
      responses:
        400:
          description: Error response
        500:
          description: Error response
    post:
      responses:
        400:
          description: Error response
        500:
          description: Error response
    put:
      responses:
        400:
          description: Error response
        500:
          description: Error response
    trace:
      responses:
        400:
          description: Error response
        500:
          description: Error response

  /api/about:
    get:
      summary: Application build metadata
      description: Returns the server's authoritative app version information, including version, commit, build date, and author credits.
      responses:
        200:
          description: AboutInfo JSON
        400:
          description: Error response
        500:
          description: Internal server error

  /api/about/license:
    get:
      summary: Open-source license text
      description: Streams the repository license file used by the About page.
      responses:
        200:
          description: License text
        400:
          description: Error response
        500:
          description: License file not found

  /api/achievements:
    get:
      summary: Get stored achievements dashboard
      description: Returns stored achievement totals by system and by canonical game plus the latest achievement refresh state. This endpoint only reads server-owned SQLite rows and does not fetch achievements from external integrations.
      responses:
        200:
          description: AchievementsDashboardResponse
        400:
          description: Error response
        500:
          description: Internal server error

  /api/achievements/explorer:
    get:
      summary: Get stored achievements explorer
      description: Returns stored achievement sets and achievement rows grouped by canonical game. This endpoint is read-only over server-owned SQLite rows and does not trigger provider fetches.
      responses:
        200:
          description: AchievementsExplorerResponse
        400:
          description: Error response
        500:
          description: Internal server error

  /api/achievements/refresh:
    post:
      summary: Start achievements refresh
      description: Starts a background job that refreshes achievements for all profile-visible games with configured achievement-capable integrations. Provider calls are throttled and may emit waiting/progress events when a provider rate-limits refresh work. Provider failures are persisted as degraded per-game state and do not stop unrelated games.
      responses:
        202:
          description: AchievementRefreshJobStatus
        400:
          description: Error response
        409:
          description: An achievement refresh job is already active
        500:
          description: Internal server error

  /api/achievements/refresh/jobs/{job_id}:
    get:
      summary: Get achievements refresh job
      description: Returns the latest in-memory status for an achievement refresh job, including current provider, item, and optional provider backoff wait state.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: AchievementRefreshJobStatus
        400:
          description: Error response
        404:
          description: Job not found
        500:
          description: Error response

  /api/auth/callback/import:
    post:
      summary: Import pasted OAuth callback URL
      description: Completes an OAuth2 or OpenID-style plugin consent flow when the provider callback cannot reach MGA automatically. The client posts the final callback URL copied from the browser address bar; MGA validates the callback path, plugin id, and pending state, then invokes the same auth.oauth.callback plugin method used by direct redirects.
      requestBody:
        description: 'JSON: { plugin_id: string, callback_url: string }'
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: Status ok JSON
        400:
          description: Malformed URL, wrong callback path/plugin, missing or stale state, provider denial, or plugin callback failure
        500:
          description: Internal server error

  /api/auth/callback/{plugin_id}:
    get:
      summary: Handle OAuth callback for a plugin
      description: Consumes the browser redirect callback for OAuth2 or OpenID-style plugin consent flows, invokes auth.oauth.callback on the plugin, publishes oauth_complete or oauth_error over SSE, and returns a small HTML page that closes the tab.
      parameters:
        - name: plugin_id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: HTML callback result page
        400:
          description: Error response
        500:
          description: Internal server error

  /api/auth/credential:
    delete:
      responses:
        400:
          description: Error response
        500:
          description: Error response
    get:
      responses:
        400:
          description: Error response
        500:
          description: Error response
    put:
      responses:
        400:
          description: Error response
        500:
          description: Error response

  /api/auth/credential-tickets/redeem:
    post:
      responses:
        400:
          description: Error response
        500:
          description: Error response

  /api/auth/login:
    post:
      responses:
        400:
          description: Error response
        500:
          description: Error response

  /api/auth/logout:
    post:
      responses:
        400:
          description: Error response
        500:
          description: Error response

  /api/auth/qr/{plugin_id}/begin:
    post:
      summary: Start an app-approval (QR) sign-in
      description: Asks the plugin to begin a sign-in the player approves in the provider's own mobile app, and returns the challenge URL plus the session identifiers to poll with. No password or second factor is ever entered into MGA.
      parameters:
        - name: plugin_id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Challenge JSON with client_id, request_id, challenge_url, and interval_seconds
        400:
          description: plugin_id or profile missing
        500:
          description: Error response

  /api/auth/qr/{plugin_id}/poll:
    post:
      summary: Poll an app-approval (QR) sign-in
      description: Reports whether the player has approved the challenge yet. While pending it returns status "pending" and may include a replacement challenge_url that the UI must display immediately without changing the session identifiers. Once approved it binds the token-proven provider identity, stores the returned long-lived credential on the calling profile's own connection, and clears any re-authentication flag.
      parameters:
        - name: plugin_id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Poll JSON with status "pending" or "ok" (plus a rotated challenge_url while pending or safe provider_identity/persona metadata when approved)
        400:
          description: Missing session fields, unknown connection, plugin mismatch, another profile's connection, or an expired challenge
        500:
          description: Credentials could not be saved

  /api/auth/session:
    get:
      responses:
        400:
          description: Error response
        500:
          description: Error response

  /api/cache/clear:
    post:
      summary: Clear all cached source entries
      description: Deletes all reusable cache entries and removes the materialized cache root contents.
      responses:
        200:
          description: Status ok JSON
        400:
          description: Error response
        500:
          description: Internal server error

  /api/cache/entries:
    get:
      summary: List cached source entries
      description: Returns all reusable cache entries with operator-facing metadata such as integration label, source context, profile, status, size, and timestamps.
      responses:
        200:
          description: JSON object with entries[] of cache entry DTOs
        400:
          description: Error response
        500:
          description: Internal server error

  /api/cache/entries/{entry_id}:
    delete:
      summary: Evict one cached source entry
      description: Deletes one cache entry, its tracked files, and the materialized files on disk.
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
      responses:
        204:
          description: Entry deleted
        400:
          description: entry_id is required
        500:
          description: Internal server error

  /api/cache/jobs:
    get:
      summary: List recent cache prepare jobs
      description: 'Returns recent cache prepare/materialization jobs in reverse-updated order. Query: limit (optional, defaults to 25).'
      responses:
        200:
          description: JSON object with jobs[] of SourceCacheJobStatus
        400:
          description: Error response
        500:
          description: Internal server error

  /api/cache/jobs/{job_id}:
    get:
      summary: Get one cache prepare job
      description: Returns persisted status for one cache prepare/materialization job, including progress, terminal error, and entry linkage when ready.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: SourceCacheJobStatus JSON
        400:
          description: job_id is required
        404:
          description: Job not found
        500:
          description: Internal server error

  /api/catalog/offers:
    get:
      summary: List catalog offers
      description: 'Returns this profile''s provider offers with the latest append-only availability observation, current/latest package versions, evidence timestamps, entitlement, delivery mode, and staleness. Optional query parameters: canonical_game_id, provider, availability, stale.'
      responses:
        200:
          description: JSON object with profile-scoped offers[]
        400:
          description: Invalid availability or stale filter
        403:
          description: Profile context is missing or forbidden
        500:
          description: Internal server error

  /api/catalog/offers/{offer_id}:
    get:
      summary: Get a catalog offer
      description: Returns one offer only when it belongs to the active profile. Foreign-profile and unknown identifiers both fail closed as not found.
      parameters:
        - name: offer_id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Catalog Offer JSON
        400:
          description: Error response
        403:
          description: Profile context is missing or forbidden
        404:
          description: Offer not found in the active profile
        500:
          description: Internal server error

  /api/catalog/offers/{offer_id}/history:
    get:
      summary: List catalog offer history
      description: Returns append-only added, removed, returned, leaving-soon, and version-change events for one active-profile offer, newest first. Optional limit is 1 through 1000 and defaults to 100.
      parameters:
        - name: offer_id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: JSON object with newest-first events[]
        400:
          description: Invalid limit
        403:
          description: Profile context is missing or forbidden
        404:
          description: Offer not found in the active profile
        500:
          description: Internal server error

  /api/config/frontend:
    get:
      summary: Get frontend preferences
      description: Returns stored SPA preferences as a JSON object; {} if unset or invalid.
      responses:
        200:
          description: JSON object
        400:
          description: Error response
        500:
          description: Internal server error
    post:
      summary: Set frontend preferences
      description: Upserts SPA preferences as a single JSON object (theme, layout, active save-sync integration, etc.). Stored under key frontend.
      requestBody:
        description: JSON object (any keys). Max size enforced by server.
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: Saved
        400:
          description: Not a JSON object or too large
        500:
          description: Internal server error

  /api/config/{key}:
    post:
      summary: Set config value
      description: Upserts a configuration value by key (e.g. google_drive_creds).
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: 'JSON: { "value": "string" }'
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: Value set
        400:
          description: Invalid body
        500:
          description: Internal server error

  /api/content/v1/copies/{copy_id}/files/{file_id}:
    get:
      summary: Download one content-copy file
      description: Streams one manifest-listed file after revalidating profile, copy, integration, and opaque file ownership. Supports one HTTP byte range, ETag conditional requests, safe attachment naming, explicit MIME, and resumable delivery.
      parameters:
        - name: copy_id
          in: path
          required: true
          schema:
            type: string
        - name: file_id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Complete file bytes
        400:
          description: Invalid copy or file identifier
        404:
          description: Copy/file missing or owned by another profile
        409:
          description: Materialization required, delivery unavailable, or source changed
        500:
          description: Internal server error
    head:
      summary: Inspect one content-copy file
      description: Returns the same authorization, ETag, MIME, length, range, and content-disposition headers as GET without a response body.
      parameters:
        - name: copy_id
          in: path
          required: true
          schema:
            type: string
        - name: file_id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: File headers
        400:
          description: Error response
        404:
          description: Copy/file missing or owned by another profile
        409:
          description: Materialization required, delivery unavailable, or source changed
        500:
          description: Error response

  /api/content/v1/copies/{copy_id}/manifest:
    get:
      summary: Get a content-copy manifest
      description: Returns Content Delivery API v1 metadata for one concrete copy owned by the authenticated profile. File IDs are stable opaque hashes; relative paths are validated and no server/source/cache path or credential is exposed.
      parameters:
        - name: copy_id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Content manifest schema v1
        400:
          description: Invalid copy identifier
        404:
          description: Copy missing or owned by another profile
        409:
          description: Source file evidence is invalid
        500:
          description: Internal server error

  /api/content/v1/copies/{copy_id}/materializations:
    post:
      summary: Prepare remote content for delivery
      description: Starts or reuses a bounded, profile-authorized source-cache job for the current copy evidence. Direct sources complete immediately; remote sources return a durable job that can be polled or cancelled.
      parameters:
        - name: copy_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: No request body
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: Direct source or matching cache is already ready
        202:
          description: Materialization job accepted
        400:
          description: Error response
        404:
          description: Copy missing or owned by another profile
        409:
          description: Source is not materializable or its manifest is invalid
        500:
          description: Internal server error

  /api/content/v1/materializations/{job_id}:
    get:
      summary: Get a content materialization job
      description: Returns sanitized progress for one durable materialization job visible to the authenticated profile. Provider errors, paths, credentials, and foreign-profile facts are never returned.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Sanitized materialization job
        400:
          description: Error response
        404:
          description: Job missing or owned by another profile
        500:
          description: Internal server error

  /api/content/v1/materializations/{job_id}/cancel:
    post:
      summary: Cancel a content materialization job
      description: Requests cancellation of an active profile-owned materialization. Plugin work receives context cancellation, partial files are removed, and the durable job becomes cancelled.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: No request body
        content:
          application/json:
            schema:
              type: object
      responses:
        202:
          description: Cancellation requested
        400:
          description: Error response
        404:
          description: Job missing or owned by another profile
        409:
          description: Job is already terminal
        500:
          description: Internal server error

