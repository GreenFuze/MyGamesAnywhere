      description: Requires scope catalog.read. Includes the stable file ids the content routes accept, so a frontend can go from a library row to a download without a second discovery step.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Game detail JSON
        400:
