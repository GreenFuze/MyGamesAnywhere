        403:
          description: Token lacks catalog.read
        404:
          description: Game not found for this profile
        500:
          description: Error response

  /api/frontend/v1/media/{assetID}:
    get:
      summary: Fetch one media asset
      description: 'Requires scope metadata.read. Served through http.ServeContent, so Range, HEAD and If-None-Match behave as they do for the console. The URL carries no credential: authorization is the bearer token on the request.'
      parameters:
        - name: assetID
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Binary media stream
        400:
          description: Error response
        401:
          description: Missing or invalid bearer token
        403:
          description: Token lacks metadata.read
        404:
          description: Asset not found for this profile
        500:
          description: Error response
    head:
      parameters:
        - name: assetID
          in: path
          required: true
          schema:
            type: string
      responses:
        400:
          description: Error response
        500:
          description: Error response

  /api/games:
    delete:
      summary: Delete all games
      description: Removes all games and their files from the database. Use before a full rescan to start fresh.
      responses:
        200:
          description: All games deleted
        400:
          description: Error response
        500:
          description: Internal server error
    get:
      summary: List games (paginated)
      description: 'Returns total, page, page_size and games[] as full detail objects (same shape as GET /api/games/{id}/detail). Query: page (0-based, default 0), page_size (default 100, max 2000), sort_by (title, release_date, platform, rating), and sort_dir (asc, desc). Sorting is applied before pagination. page_size=0 requests all games in one response (rejected if library exceeds 20000 games; use pagination). Totals also available via GET /api/stats (canonical_game_count).'
      responses:
        200:
          description: 'ListGamesResponse: total, page, page_size, games (GameDetailResponse[])'
        400:
          description: Invalid query or library too large for page_size=0
        500:
          description: Internal server error

  /api/games/source-move-destinations:
    get:
      summary: List safe move destinations
      description: Lists this profile's enabled game-source connections that implement the complete destination transfer protocol. Connection secrets and backing storage identities are not returned.
      responses:
        200:
          description: JSON object with destinations[] of SourceMoveDestination
        400:
          description: Error response
        500:
          description: Internal server error

  /api/games/source-moves:
    get:
      summary: List recoverable game-file moves
      description: 'Returns this profile''s persisted move history and any active or actionable recovery jobs. Query: limit (optional, defaults to 50).'
      responses:
        200:
          description: JSON object with jobs[] of SourceMoveJob
        400:
          description: Invalid limit
        500:
          description: Internal server error

  /api/games/source-moves/{job_id}:
    get:
      summary: Get one game-file move
      description: Returns one move job only when it belongs to the active profile.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: SourceMoveJob JSON
        400:
          description: Error response
        404:
          description: Move job not found
        500:
          description: Internal server error

  /api/games/source-moves/{job_id}/cleanup:
    post:
      summary: Clean an uncommitted move stage
      description: Removes only MGA-owned temporary destination content for a pre-commit failed or interrupted move. The original remains unchanged.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        202:
          description: Updated SourceMoveJob JSON
        400:
          description: Error response
        404:
          description: Move job not found
        409:
          description: Move is not eligible for stage cleanup
        500:
          description: Internal server error

  /api/games/source-moves/{job_id}/keep-both:
    post:
      summary: Finish a move by keeping both copies
      description: Keeps the verified destination and original after a post-commit recovery condition, then refreshes the library and completes the job.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        202:
          description: Updated SourceMoveJob JSON
        400:
          description: Error response
        404:
          description: Move job not found
        409:
          description: Move is not eligible to keep both
        500:
          description: Internal server error

  /api/games/source-moves/{job_id}/retry:
    post:
      summary: Retry a recoverable game-file move
      description: Retries from the persisted safe boundary. Before commit, MGA removes only its owned stage and recopies; after commit, it retries library discovery or original cleanup without replacing the verified destination.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        202:
          description: Updated SourceMoveJob JSON
        400:
          description: Error response
        404:
          description: Move job not found
        409:
          description: Move is not retryable or recovery failed
        500:
          description: Internal server error

  /api/games/sources/delete-batch:
    post:
      summary: Hard delete multiple source records
      description: Deletes explicitly selected eligible file-backed source records as one operation. Provider file delete plans are built before execution, duplicate backing file operations are skipped, and canonical grouping is recomputed once after database rows are removed.
      responses:
        200:
          description: DeleteSourceGamesResponse
        400:
          description: Invalid request
        404:
          description: Game or source record not found
        409:
          description: Source record is not eligible for hard delete
        500:
          description: Internal server error

  /api/games/sources/move-preview:
    post:
      summary: Preview safe game-file moves
      description: Builds a non-mutating, profile-scoped move plan with exact files, destination storage identity, source cleanup behavior, and whole-folder safety evidence.
      requestBody:
        description: 'JSON: { items: [{ canonical_game_id, source_game_id, destination_integration_id, destination_path }] }'
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: SourceMovePreview JSON
        400:
          description: Invalid, unsafe, unsupported, or cross-profile request
        500:
          description: Internal server error

  /api/games/sources/moves:
    post:
      summary: Start recoverable game-file moves
      description: Persists and starts verified copy-before-delete moves. Each destination is reserved across profiles by backing storage identity and path until the job reaches a finished state.
      requestBody:
        description: 'JSON: { items: [{ canonical_game_id, source_game_id, destination_integration_id, destination_path }] }'
        content:
          application/json:
            schema:
              type: object
      responses:
        202:
          description: JSON object with jobs[] of SourceMoveJob
        400:
          description: Invalid request
        409:
          description: Destination collision or move cannot start
        500:
          description: Internal server error

  /api/games/{id}:
    get:
      summary: Get game by ID
      description: Returns full game detail (same JSON as GET /api/games/{id}/detail and each element of GET /api/games).
